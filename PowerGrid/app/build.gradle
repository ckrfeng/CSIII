plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // Standard testing setup
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Add the Windows libraries
    runtimeOnly "org.openjfx:javafx-graphics:21:win"
    runtimeOnly "org.openjfx:javafx-controls:21:win"
}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.graphics' ]
}

application {
    // This MUST match your folder/package and the class with the main method
    mainClass = 'PowerGrid.PowerGrid' 
}
